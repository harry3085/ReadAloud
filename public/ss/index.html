<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E8714A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ScoreSnap">
<link rel="manifest" href="/ss/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>ScoreSnap</title>
<link rel="stylesheet" href="/ss/ss.css">
<style>
  .center { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-box { width:100%; max-width:380px; padding:28px 24px; }
  .login-box h1 { margin:0 0 4px; font-size:26px; font-weight:800; color:var(--brand-dark); }
  .login-box .ss-input { margin-bottom:10px; min-height:50px; }
  .err { color:var(--bad); font-size:13px; min-height:18px; margin-bottom:8px; }
  #pcBanner { position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:100050; background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-bd);
    padding:10px 18px; border-radius:12px; font-size:14px; font-weight:600; max-width:92vw; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,.16); }
  @media (min-width:1024px) { #pcBanner { top:56px; } }
</style>
</head>
<body class="ss-app">

<!-- 로그인 -->
<div id="loginView" class="center hidden">
  <div class="ss-card login-box">
    <h1>ScoreSnap</h1>
    <div class="ss-sub" style="margin-bottom:18px;">학원장 계정으로 로그인하세요.<br>한 번 로그인하면 이 기기에서는 계속 유지돼요.</div>
    <input id="uid" class="ss-input" type="text" placeholder="아이디" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    <input id="pw" class="ss-input" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="ss-btn ss-btn--primary ss-btn--lg ss-btn--block" id="btnLogin">로그인</button>
  </div>
</div>

<!-- 홈 (ScoreSnap 을 닫았을 때) — 2단계에서 기록 목록 홈으로 대체 -->
<div id="homeView" class="center hidden">
  <div class="ss-card login-box" style="text-align:center;">
    <h1>ScoreSnap</h1>
    <div class="ss-sub" style="margin-bottom:18px;" id="homeSub"></div>
    <button class="ss-btn ss-btn--primary ss-btn--lg ss-btn--block" id="btnOpen">ScoreSnap 열기</button>
    <button class="ss-btn ss-btn--lg ss-btn--block" id="btnLogout" style="margin-top:10px;">로그아웃</button>
  </div>
</div>

<div id="boot" class="center"><div class="ss-spinner"></div></div>
<div id="pcBanner" class="hidden"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getStorage, ref, uploadBytes, deleteObject } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
import { createScoreSnapStore } from '/ss/store.js';

const app = initializeApp({
  apiKey: 'AIzaSyAb5d8w9mI5_hpcoBFcWnG5tE1TF_8guw8', authDomain: 'readaloud-51113.firebaseapp.com', projectId: 'readaloud-51113',
  storageBucket: 'readaloud-51113.firebasestorage.app', messagingSenderId: '944153888350', appId: '1:944153888350:web:47091c0771d20be8ea56cf',
});
const auth = getAuth(app), db = getFirestore(app), storage = getStorage(app);
const $ = (id) => document.getElementById(id);
const view = (v) => { for (const x of ['loginView', 'homeView', 'boot']) $(x).classList.toggle('hidden', x !== v); };
let currentUser = null, scriptLoaded = false;

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

// ─── 학원앱 ScoreSnap 화면(scoresnap.js)이 기대하는 전역 ───
window.MY_ACADEMY_ID = 'default'; window.MY_ACADEMY_NAME = ''; window.MY_FEATURE_FLAGS = { scoreSnap: true };
window._ssGetIdToken = async () => { if (!currentUser) throw new Error('로그인 정보 없음'); return await currentUser.getIdToken(); };
window._ssStore = createScoreSnapStore({ db, storage, getUid: () => currentUser && currentUser.uid, getAid: () => window.MY_ACADEMY_ID });

function modal(title, sub, withCancel) {
  return new Promise((resolve) => {
    const danger = /삭제/.test(String(title || ''));          // 삭제 확인은 빨간 버튼
    const ov = document.createElement('div');
    ov.className = 'ss-scrim ss-scrim--modal'; ov.style.zIndex = '100010';
    ov.innerHTML = `<div class="ss-dialog" role="dialog" aria-modal="true">
      <b class="ss-dialog__t"></b><div class="ss-dialog__s"></div>
      <div class="ss-dialog__b">${withCancel ? '<button class="ss-btn ss-btn--lg" data-v="0">취소</button>' : ''}<button class="ss-btn ss-btn--lg ${danger ? 'ss-btn--danger' : 'ss-btn--primary'}" data-v="1">${danger ? '삭제' : '확인'}</button></div></div>`;
    const card = ov.firstElementChild;
    card.querySelector('.ss-dialog__t').textContent = title || ''; card.querySelector('.ss-dialog__s').textContent = sub || '';
    const done = (v) => { document.removeEventListener('keydown', onKey, true); ov.remove(); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } else if (e.key === 'Enter') { e.stopPropagation(); e.preventDefault(); done(true); } };
    ov.onclick = (e) => { const bt = e.target.closest('button[data-v]'); if (bt) return done(bt.dataset.v === '1'); if (e.target === ov && withCancel) done(false); };
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(ov);
    const first = ov.querySelector('button[data-v="1"]'); if (first) first.focus();
  });
}
window.showConfirm = (title, sub) => modal(title, sub, true);
window.showAlert = (title, sub) => modal(title, sub, false);

// ─── 채점은 서버(PC 채점 프로그램)가 한다: /api/scoresnap-grade 호출을 "작업 요청 → 결과 대기"로 바꿔치기 ───
// 학원앱과 같은 화면 코드를 그대로 쓰되, Gemini 서버 대신 학원 PC 의 Claude 가 채점한다.
const KEEP_MS = 5 * 24 * 3600 * 1000;
let waiting = 0;
function banner(txt) { const b = $('pcBanner'); if (!txt) { b.classList.add('hidden'); return; } b.textContent = txt; b.classList.remove('hidden'); }
function b64ToBlob(b64, mime) { const bin = atob(b64); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return new Blob([u8], { type: mime || 'image/jpeg' }); }

// 작업 한 건을 서버에 올리고 PC 채점 프로그램이 끝낼 때까지 기다린다 → 완료된 작업 문서를 돌려줌
async function runJob(jobType, imageBase64, mime, payload) {
  const aid = window.MY_ACADEMY_ID;
  const jref = doc(collection(db, 'scoresnapSessions'));
  const path = `scoresnap/${aid}/jobs/${jref.id}.jpg`;
  try {
    await uploadBytes(ref(storage, path), b64ToBlob(imageBase64, mime), { contentType: 'image/jpeg' });
    await setDoc(jref, {
      academyId: aid, kind: 'job', keyStatus: 'job', needsWork: true, status: 'queued',
      createdBy: currentUser.uid, createdAt: serverTimestamp(), expiresAt: new Date(Date.now() + KEEP_MS),
      jobType, imagePath: path, payload,
    });
  } catch (e) { return { status: 'error', error: '요청을 올리지 못했어요: ' + e.message }; }

  waiting++;
  const out = await new Promise((resolve) => {
    const t0 = Date.now(); let unsub = null;
    const tick = setInterval(() => {
      if ((Date.now() - t0) / 1000 > 40 * 60) { clearInterval(tick); unsub && unsub(); resolve({ status: 'error', error: 'PC 채점 프로그램 응답이 없어요 (40분)' }); }
    }, 5000);
    unsub = onSnapshot(jref, (d) => {
      const j = d.data(); if (!j) return;
      if (j.status === 'queued' && Date.now() - t0 > 15000) banner('PC 채점 프로그램이 아직 가져가지 않았어요 — 학원 PC 에서 채점 프로그램(start.bat)이 켜져 있는지 확인하세요');
      else if (j.status === 'working') banner('PC 에서 처리 중…');
      if (j.status === 'done' || j.status === 'error') { clearInterval(tick); unsub(); resolve(j); }
    }, (e) => { clearInterval(tick); resolve({ status: 'error', error: e.message }); });
  });
  waiting--; if (!waiting) banner('');
  deleteObject(ref(storage, path)).catch(() => {}); deleteDoc(jref).catch(() => {});
  return out;
}
const jsonRes = (obj, status) => new Response(JSON.stringify(obj), { status, headers: { 'Content-Type': 'application/json' } });

// /api/scoresnap-grade (정답지 읽기·학생 채점)
async function gradeViaPc(body) {
  const isKey = body.mode === 'answerKey', meta = body.answerKeyMeta || {};
  const out = await runJob(isKey ? 'key' : 'student', body.imageBase64, body.imageMimeType,
    isKey ? { layoutHint: body.layoutHint || 'numbered' }
      : { answerKey: JSON.parse(JSON.stringify({ questions: body.answerKeyQuestions, layout: meta.layout, givenColumn: meta.givenColumn, answerColumns: meta.answerColumns })) });
  if (out.status === 'done' && out.result) return jsonRes({ success: true, mode: body.mode, ...out.result }, 200);
  return jsonRes({ error: out.error || '채점에 실패했어요' }, 502);
}
// /api/ocr 중 마킹용 "문항 번호·점수 글자 위치" — Google Vision 대신 PC 의 Claude 가 찾는다 (결과 형식은 Vision 과 같음)
async function marksViaPc(body, payload) {
  const out = await runJob('ocr', body.imageBase64, body.mimeType, payload);
  if (out.status === 'done' && out.result && Array.isArray(out.result.words)) return jsonRes({ success: true, words: out.result.words }, 200);
  return jsonRes({ error: out.error || '번호 위치를 읽지 못했어요' }, 502);
}
const origFetch = window.fetch.bind(window);
window.fetch = (input, init) => {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  const u = url.split('?')[0];
  if (init && init.method === 'POST' && (u === '/api/scoresnap-grade' || u === '/api/ocr')) {
    try {
      const body = JSON.parse(init.body);
      if (u === '/api/scoresnap-grade') return gradeViaPc(body);
      if (body.wordBoxes === true && !body.allWords && body.expectCount > 0) return marksViaPc(body, { total: body.expectCount });   // 번호형
      if (body.wordBoxes === true && body.allWords && body.tableMeta) return marksViaPc(body, { table: body.tableMeta });             // 표 형식
    } catch (e) { /* 파싱 실패 시 원래 경로 */ }
  }
  return origFetch(input, init);
};

// ─── 로그인 ───
const friendly = (e) => {
  const c = e && e.code || '';
  if (c === 'auth/too-many-requests') return '비밀번호를 여러 번 잘못 입력해서 잠시 차단됐어요. 잠시 후 다시 시도해 주세요.';
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password') return '비밀번호가 틀렸어요.';
  if (c === 'auth/network-request-failed') return '인터넷 연결을 확인해 주세요.';
  return e && e.message ? e.message : '로그인에 실패했어요.';
};
async function doLogin() {
  const u = $('uid').value.trim().toLowerCase(), p = $('pw').value;
  $('loginErr').textContent = '';
  if (!u || !p) { $('loginErr').textContent = '아이디와 비밀번호를 입력하세요.'; return; }
  $('btnLogin').disabled = true;
  try {
    const lk = await getDoc(doc(db, 'usernameLookup', u));
    if (!lk.exists() || !lk.data().email) throw new Error('아이디를 찾을 수 없어요.');
    await signInWithEmailAndPassword(auth, lk.data().email, p);
    try { localStorage.setItem('ssUser', u); } catch (_) {}
  } catch (e) { $('loginErr').textContent = friendly(e); }
  $('btnLogin').disabled = false;
}
$('btnLogin').onclick = doLogin;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
try { $('uid').value = localStorage.getItem('ssUser') || ''; } catch (_) {}
$('btnLogout').onclick = async () => { await signOut(auth); };
window.addEventListener('ss-logout', async () => { await signOut(auth); });
$('btnOpen').onclick = () => openSS();

function loadScoreSnapScript() {
  return new Promise((resolve, reject) => {
    if (scriptLoaded) return resolve();
    const s = document.createElement('script'); s.src = '/ss/scoresnap.js?v=' + Date.now();
    s.onload = () => { scriptLoaded = true; resolve(); }; s.onerror = () => reject(new Error('ScoreSnap 화면을 불러오지 못했어요'));
    document.head.appendChild(s);
  });
}
let watching = false;
function watchOverlay() {
  if (watching) return; watching = true;
  // ScoreSnap 을 닫으면(오버레이 제거) 홈 화면을 보여준다
  new MutationObserver(() => { if (!document.getElementById('scoreSnapOverlay') && currentUser) { $('homeSub').textContent = (window.MY_ACADEMY_NAME || '') + ' 학원장'; view('homeView'); } })
    .observe(document.body, { childList: true });
}
async function openSS() {
  try { await loadScoreSnapScript(); } catch (e) { alert(e.message); return; }
  watchOverlay();
  view('boot'); $('boot').classList.add('hidden');
  await window.openScoreSnap();
  try { const sid = new URLSearchParams(location.search).get('sid'); if (sid && window._ssOpenBySid) { history.replaceState(null, '', location.pathname); await window._ssOpenBySid(sid); } } catch (_) {}
}

onAuthStateChanged(auth, async (user) => {
  currentUser = user || null;
  if (!user) { view('loginView'); return; }
  try {
    const t = await user.getIdTokenResult(); window.MY_ACADEMY_ID = t.claims.academyId || 'default';
    try { const a = await getDoc(doc(db, 'academies', window.MY_ACADEMY_ID)); window.MY_ACADEMY_NAME = (a.exists() && a.data().name) || ''; } catch (_) {}
  } catch (_) {}
  openSS();
});
</script>
</body>
</html>
